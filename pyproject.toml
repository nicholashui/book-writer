[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "book-writer-combiner"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "pyyaml>=6.0",
]

[project.scripts]
combine-book = "book_combiner.cli:main"

[tool.setuptools.package-dir]
"" = "tools"

[tool.setuptools.packages.find]
where = ["tools"]

[tool.setuptools.package-data]
book_combiner = ["prompts/*", "topics/*/*"]
